<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada - Fabricio Sotelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #080A0F;
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --accent-gold: #F8CD46;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card {
      max-width: 480px;
      padding: 48px 36px;
      border-radius: 32px;
      background: rgba(20, 22, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 24px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-gold);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      line-height: 1.15;
    }
    p {
      font-size: 15.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 999px;
      background: var(--accent-gold);
      color: #0B0B0E;
      font-size: 15.5px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(248, 205, 70, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(248, 205, 70, 0.42);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Error 404</span>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe o ha sido movida.</p>
    <a href="/" class="btn">Volver al Portafolio</a>
  </div>
</body>
</html>
